version: 2
# The site has no npm dependencies (Node 24 only), so the only thing to keep
# current is the pinned SHAs in .github/workflows. Same cooldown as the other
# Fors-Corp repos: nothing merges the day it is published.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      # Dependabot rejects semver-major-days for the github-actions ecosystem.
      default-days: 7
