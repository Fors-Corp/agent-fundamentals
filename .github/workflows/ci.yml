name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Translations match the English structure
        run: npm run check
      - name: Build all language pages
        run: npm run build
      - name: Every language page exists and declares its language
        run: |
          set -e
          for l in es ca fr pt it de; do grep -q "<html lang=\"$l\">" "agent-fundamentals/$l/index.html"; done
          grep -q '<html lang="en">' agent-fundamentals/index.html
          echo "7 pages OK"
