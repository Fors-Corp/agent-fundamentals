name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Translations match the English structure
        run: npm run check
      - name: Build all language pages
        run: npm run build
      - name: Every language page exists and declares its language
        run: |
          set -e
          for l in es ca fr pt it de; do grep -q "<html lang=\"$l\">" "agent-fundamentals/$l/index.html"; done
          grep -q '<html lang="en">' agent-fundamentals/index.html
          echo "7 pages OK"
