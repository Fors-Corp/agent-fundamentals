name: CodeQL

# Static analysis for security and code quality (security-and-quality suite).
# Both "Analyze (...)" jobs are required status checks on `main`: they prove the
# scan ran, not that it was clean. Findings show up as "Code scanning results".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 18 * * 1" # weekly, catches newly published queries/advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF results
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
